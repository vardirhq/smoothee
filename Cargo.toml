[package]
name = "smoothee"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A safer, clearer Git and GitHub workflow. Make Git smooth."
license = "MIT"
repository = "https://github.com/MadsenDev/smoothee"
readme = "README.md"
keywords = ["git", "github", "cli", "workflow", "merge"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "smoothee"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
console = "0.15"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
